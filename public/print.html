<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽籤紀錄表</title>
<link rel="stylesheet" href="css/large-type.css">
<style>
  @page { size: A4 portrait; margin: 18mm 16mm; }

  .sheet {
    max-width: 178mm; margin: 0 auto;
    border: 4px solid var(--border-strong); border-radius: var(--radius);
    padding: 1.2rem 1.4rem;
  }
  .sheet h1 {
    font-size: 1.6rem; text-align: center; letter-spacing: 0.3em;
    margin: 0 0 0.3rem; padding-bottom: 0.5rem;
    border-bottom: 4px double var(--border-strong);
  }
  .sheet .sub { text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.2rem; }

  .field { display: grid; grid-template-columns: minmax(0, 9rem) 1fr; gap: 0.9rem;
           padding: 0.6rem 0; border-bottom: 2px solid var(--border); }
  .field dt { font-weight: 700; color: var(--text-muted); margin: 0; }
  .field dd { margin: 0; font-weight: 700; word-break: break-all; }

  .headline { text-align: center; padding: 1.2rem 0; margin: 0.8rem 0;
              border: 3px solid var(--border-strong); border-radius: var(--radius); }
  .headline .who { font-size: clamp(2.4rem, 9vw, 4rem); font-weight: 700; line-height: 1.2; }

  .proof { font-size: var(--fs-small); line-height: 1.55; color: var(--text-muted);
           word-break: break-all; margin-top: 1rem;
           border-top: 2px solid var(--border); padding-top: 0.7rem; }
  .proof code { font-size: var(--fs-small); }

  .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; margin-top: 1.6rem; }
  .sign div { border-top: 2px solid var(--border-strong); padding-top: 0.5rem;
              font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }

  @media print {
    /* 20px 下限是螢幕可讀性規範；紙本以實體尺寸為準，
       雜湊值放大到 20px 反而會撐爆版面且無助閱讀。 */
    :root { font-size: 12pt; --fs-small: 8pt; }
    body { background: #fff; color: #000; }
    .noprint { display: none !important; }
    .sheet { border: 2px solid #000; max-width: none; }
    .headline { border-color: #000; }
    a { color: #000; text-decoration: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="noprint" style="margin-bottom:1rem">
    <div class="row">
      <button class="btn" onclick="print()" type="button">列印</button>
      <a class="btn" href="index.html">回公開看板</a>
    </div>
  </div>

  <main id="app"><p class="empty">載入中…</p></main>
</div>

<script type="module">
import { loadAll, caseTypeOf, applyAmends, fmtTime } from './js/data.mjs';
import { courtStyle, esc, fail, versionBanner, terms } from './js/ui.mjs';

const APP_VERSION = '1.5.0';

const app = document.getElementById('app');

try {
  const { config, history } = await loadAll();
  const T = terms(config);
  const stale = versionBanner(config, APP_VERSION);
  if (stale) document.querySelector('.noprint').insertAdjacentHTML('afterend', stale);
  const id = new URLSearchParams(location.search).get('id');
  const raw = history.find((r) => r.recordId === id);

  if (!raw) {
    app.innerHTML = `<p class="empty">找不到紀錄 ${esc(id ?? '')}</p>`;
  } else {
    const r = applyAmends(history, raw);
    const ct = caseTypeOf(config, r.caseTypeId);
    const cs = courtStyle(config, r.resultCourtId);
    const superseded = history.some((h) => h.type === 'REDRAW' && h.originalRecordId === r.recordId);
    const voided = history.some((h) => h.type === 'VOID' && h.targetRecordId === r.recordId);

    const verifyUrl = new URL(`verify.html?id=${encodeURIComponent(r.recordId)}`, location.href).href;

    const flag = voided
      ? '<div class="note warn" style="margin-bottom:1rem"><strong>本件已作廢</strong>，本表僅供存查。</div>'
      : superseded
        ? '<div class="note warn" style="margin-bottom:1rem"><strong>本次抽籤因${esc(T.drawee)}迴避而重抽，本結果不生效。</strong></div>'
        : '';

    const excl = (r.excludedUnitIds ?? [])
      .map((u) => config.units.find((x) => x.id === u)?.name ?? u).join('、');

    app.innerHTML = `
      ${flag}
      <div class="sheet">
        <h1>抽籤紀錄表</h1>
        <div class="sub">案件分案抽籤系統　${esc(r.recordId)}</div>

        <dl style="margin:0">
          <div class="field"><dt>案類</dt><dd>${esc(ct?.name ?? r.caseTypeId)}</dd></div>
          <div class="field"><dt>案號</dt><dd>${esc(r.caseNo)}${r.amended ? '　（經更正）' : ''}</dd></div>
          <div class="field"><dt>${esc(T.requester)}</dt><dd>${esc(r.requesterUnitName ?? '（未記錄）')}</dd></div>
          <div class="field"><dt>抽籤時間</dt><dd>${fmtTime(r.at)}</dd></div>
        </dl>

        <div class="headline">
          <div style="font-size:0.9rem;color:var(--text-muted);font-weight:700">抽出的${esc(T.drawee)}</div>
          <div class="who">${esc(r.resultUnitName)}</div>
          <div style="font-size:1.2rem;font-weight:700">
            <span aria-hidden="true">${cs.glyph}</span> ${esc(r.resultCourtName)}
          </div>
        </div>

        <dl style="margin:0">
          <div class="field"><dt>抵分件數</dt>
            <dd>${r.offsetCount > 1 ? `${r.offsetCount} 件（重大案件）` : '1 件（一般案件）'}</dd></div>
          ${excl ? `<div class="field"><dt>迴避股別</dt>
            <dd>${esc(excl)}${r.excludeReason ? `<br>事由：${esc(r.excludeReason)}` : ''}</dd></div>` : ''}
          <div class="field"><dt>抽籤前籤筒</dt><dd>${r.binBefore.length} 支籤（第 ${r.cycleBefore} 輪）</dd></div>
          <div class="field"><dt>抽出位置</dt><dd>可抽 ${r.drawableCount} 支中的第 ${r.pickIndex + 1} 支</dd></div>
          <div class="field"><dt>執行者</dt><dd>${esc(r.operator ?? '')}</dd></div>
        </dl>

        <div class="proof">
          <strong>驗證資訊</strong><br>
          ${r.drand
            ? `公共亂數（drand ${esc(r.drand.chainHash.slice(0, 12))}…）第 <strong>${esc(String(r.drand.round))}</strong> 輪<br>
               亂數值　<code>${esc(r.drand.randomness)}</code><br>`
            : `本筆無公共亂數資料（系統上線前之紀錄，或離線備援補登）<br>`}
          紀錄雜湊　<code>${esc(r.recordHash)}</code><br>
          前筆雜湊　<code>${esc(r.prevRecordHash ?? '（本筆為第一筆）')}</code><br><br>
          任何人可至下列網址獨立重算驗證本結果：<br>
          <code>${esc(verifyUrl)}</code>
        </div>

        <div class="sign">
          <div>抽籤人簽章</div>
          <div>監交人簽章</div>
        </div>
      </div>`;
  }
} catch (err) {
  fail(app, err);
}
</script>
</body>
</html>
