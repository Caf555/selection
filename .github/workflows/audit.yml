# 每日全量稽核（第二層驗證）
# SPEC.md §4.0、§11.2
#
# 抽籤路徑只做多端點交叉比對（零第三方相依）。本工作流程負責補上
# 第二層的 BLS 密碼學驗簽，並每日重驗整條雜湊鏈。
#
# 稽核失敗會自動開 issue 告警，但不會影響已完成的分案作業。

name: 每日全量稽核

on:
  schedule:
    - cron: "0 21 * * *" # 每日 05:00（台北時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出程式碼
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 設定 Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      # 稽核路徑才安裝 @noble/curves（BLS 驗簽用）。
      # 以 npm ci 依 package-lock.json 的完整性雜湊還原，版本不可漂移。
      - name: 安裝稽核相依套件
        run: npm ci

      - name: 全部單元測試
        run: npm test

      - name: 全量稽核
        id: audit
        run: node tools/verify-all.mjs

      - name: 稽核失敗時開 issue 告警
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = `稽核失敗：${new Date().toISOString().slice(0,10)}`;
            const body = [
              '每日全量稽核未通過。',
              '',
              `執行紀錄：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '**在原因釐清前，請暫停以本系統進行分案。**',
              '',
              '可能原因：',
              '- 歷史紀錄或狀態檔遭直接修改（未經抽籤工作流程）',
              '- 有承諾批次中斷未完成開籤',
              '- drand 簽章驗證失敗',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'audit-failure',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['audit-failure'],
              });
            }
