# 迴避重抽
# SPEC.md §7.5、§4.2
#
# 適用於「抽出後才發現承辦股應迴避」。與作廢不同：作廢是這件案子不該被抽，
# 重抽是這件案子仍要分案，只是不能分給該股。
#
# 重抽同樣走兩階段承諾—開籤。若省略承諾階段，就會出現「不滿意結果 →
# 宣稱要迴避 → 重抽」的操作空間，而迴避事由是人填的、無法從外部查核。

name: 迴避重抽

on:
  workflow_dispatch:
    inputs:
      record_id:
        description: "原抽籤的紀錄編號（例如 R-000005）"
        required: true
        type: string
      reason:
        description: "迴避事由（必填，會公開）"
        required: true
        type: string

concurrency:
  group: lottery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ACTOR: ${{ github.actor }}
      RECORD_ID: ${{ inputs.record_id }}
      REASON: ${{ inputs.reason }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: 取出程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 設定 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: 演算法自我測試
        run: node --test engine/test/offset.test.mjs engine/test/operations.test.mjs engine/test/authorize.test.mjs

      - name: 設定 git 身分
        run: |
          git config user.name "court-lottery[bot]"
          git config user.email "court-lottery@users.noreply.github.com"

      # ── 階段一：承諾 ──────────────────────────────────────
      # 此階段不改動 state.json。流程若在此中斷，籤筒維持原次抽籤後的
      # 狀態，不會留下無對應紀錄的半套回復。
      - name: 建立承諾
        id: commit_phase
        run: node engine/run-redraw.mjs commit

      # 一律以環境變數引用使用者輸入，不得寫成 ${{ inputs.* }}——
      # 後者是 shell 執行前的文字替換，會構成指令注入。
      - name: 推送承諾（此步驟失敗即中止，絕不可略過而直接開籤）
        env:
          TARGET_ROUND: ${{ steps.commit_phase.outputs.target_round }}
        run: |
          git add data/pending/
          git commit -m "重抽承諾：${RECORD_ID}，目標 drand 輪次 ${TARGET_ROUND}"
          git push

      # ── 階段二：開籤 ──────────────────────────────────────
      - name: 等待目標輪次並重抽
        env:
          BATCH_ID: ${{ steps.commit_phase.outputs.batch_id }}
        run: node engine/run-redraw.mjs reveal

      - name: 推送重抽結果
        run: |
          git add data/
          git commit -m "迴避重抽：${RECORD_ID}（${REASON}）"
          git push
